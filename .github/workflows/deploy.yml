name: 🚀 Deploy to EC2

on:
  push:
    branches: [ main ]          # ubah bila branch lain dipakai
  workflow_dispatch:           # memungkinkan deploy manual dari UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ------------------------------------------------------------------
    # Set up SSH (private key) & known‑hosts
    # ------------------------------------------------------------------
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # ------------------------------------------------------------------
      # Node.js setup & install deps
      # ------------------------------------------------------------------
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # ------------------------------------------------------------------
      # Run tests (optional – delete if you have none)
      # ------------------------------------------------------------------
      - name: Run tests
        run: npm test
        continue-on-error: false   # set true to ignore test failures

      # ------------------------------------------------------------------
      # Build (if your project has a build step)
      # ------------------------------------------------------------------
      - name: Build
        run: npm run build --if-present

      # ------------------------------------------------------------------
      # Package artefak (optional – tar untuk transfer)
      # ------------------------------------------------------------------
      - name: Create tarball
        run: |
          tar czf app.tar.gz . \
            --exclude=".git" \
            --exclude="node_modules" \
            --exclude="*.log"
      
      # ------------------------------------------------------------------
      # Upload artefak ke EC2 via rsync (preserves permissions)
      # ------------------------------------------------------------------
      - name: Sync files to EC2
        env:
          APP_ROOT: ${{ secrets.APP_ROOT }}
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            --exclude=".git/" \
            --exclude="node_modules/" \
            --delete \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${APP_ROOT}/"

      # ------------------------------------------------------------------
      # Install npm deps on the server (kecepatan lebih baik daripada
      #    mengirim node_modules)
      # ------------------------------------------------------------------
      - name: Install server‑side deps
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ${{ secrets.APP_ROOT }} && npm ci --production"

      # ------------------------------------------------------------------
      # Restart systemd service (PM2 will be managed by it)
      # ------------------------------------------------------------------
      - name: Restart myapp.service
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo systemctl restart myapp.service"

      # ------------------------------------------------------------------
      # (Opsional) Slack notification
      # ------------------------------------------------------------------
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "*Deploy* ${{ github.repository }} `${{ github.ref }}` ${{ job.status }} on *${{ secrets.EC2_HOST }}*"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}