name: Deploy Service to VPS

on:
  push:
    branches:
      - main  # Trigger saat push ke branch main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode dari GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies & Test/Lint
      - name: Install dependencies and syntax check
        run: |
          npm ci
          node --check service.js

      # 4. Backup state at VPS before deployment for Rollback
      - name: Backup VPS State
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/service
            # Backup git hash
            git rev-parse HEAD > .deploy_prev_commit || echo "" > .deploy_prev_commit

      # 5. Deploy to VPS via SSH with Rollback Mechanism
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            set -e
            cd /home/ubuntu/service

            # Function to handle rollback
            rollback() {
              echo "=== Deploy failed! Initiating rollback... ==="
              PREV_COMMIT=$(cat .deploy_prev_commit)
              if [ -n "$PREV_COMMIT" ]; then
                git reset --hard $PREV_COMMIT
                npm install --omit=dev
              fi
              
              pm2 restart ambulance-service --update-env || true
              echo "=== Rollback completed. ==="
              exit 1
            }

            # Trap errors to automatically trigger rollback
            trap 'rollback' ERR

            echo "=== Pulling latest code ==="
            git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main

            echo "=== Installing dependencies ==="
            npm install --omit=dev

            echo "=== Restarting service ==="
            pm2 restart ambulance-service --update-env
            pm2 save

            echo "=== Deploy selesai! ==="
